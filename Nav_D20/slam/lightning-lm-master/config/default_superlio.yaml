# SuperLIO 前端配置文件
# 基于 super_lio/config/rslidar.yaml 的 SuperLIO 参数 + lightning 系统参数
# laser_mapping_superlio.cc 从 fasterlio 命名空间加载参数

common:
  dataset: "nclt"
  lidar_topic: "/robot/topic/rdap/top_point_cloud2"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/bynav/imu/data_raw"
  ins_topic: "/bynav/inspvax"
  bestgnsspos_topic: "/bynav/bestgnsspos"
superlio:
  # ===== 雷达类型与处理 =====
  lidar_type: 4                     # 1:LIVOX, 2:VELO32, 3:OUST64, 4:XT32, 5:MID360, 6:RSLIDAR
  scan_line: 32                    # 雷达扫描线数
  blind: 2.0                        # 盲区(m)，小于此距离的点滤除
  maxrange: 150.0                    # 最大量程(m)，超过此距离的点滤除
  time_scale: 1e-3                  # 时间单位转换（仅VELO32）

  # ===== 点云预处理 =====
  point_filter_num: 6               # 点云抽稀（每N个点取1个）
  filter_rate: 1                    # 帧率抽稀（每N帧取1帧）
  filter_size_scan: 0.3            # 帧内降采样体素大小(m)
  filter_size_map: 0.3             # 地图降采样体素大小(m)
  enable_downsample: true           # 是否启用降采样
  voxel_fliter_size: 0.5            # 降采具体素大小

  # ===== IVox 地图 =====
  ivox_grid_resolution: 0.5         # IVox 分辨率
  ivox_nearby_type: 18              # 邻近体素搜索策略(6/18/26)
  hash_capacity: 1000000          # IVox 哈希表容量

  # ===== ESKF 参数 =====
  max_iteration: 1                  # ESKF 最大迭代次数
  kf_type: 0                        # 滤波器类型
  kf_quit_eps: 0.001                # 迭代收敛阈值
  kf_align_gravity: true            # 是否对齐重力

  # ===== IMU 噪声 =====
  imu_type: 1                       # IMU类型
  gravity_norm: 9.7946              # 重力加速度(m/s^2)
  gyr_cov: 0.1                      # imu_ng: 陀螺仪噪声密度(rad/s/√Hz)
  acc_cov: 0.1                      # imu_na: 加计噪声密度(m/s^2/√Hz)
  b_gyr_cov: 0.0001                 # imu_nbg: 陀螺仪偏置随机游走
  b_acc_cov: 0.0001                 # imu_nba: 加计偏置随机游走

  # ===== 外参标定 =====
  extrinsic_est_en: false           # 是否在线估计外参
  # extrinsic_T: [0.0, 0.0, 0.0]     # LiDAR→IMU 平移
  # extrinsic_R: [1, 0, 0,           # LiDAR→IMU 旋转矩阵
  #               0, 1, 0,
  #               0, 0, 1]
  extrinsic_T: [ 0.4594, 0.0, 0.0516] 
  extrinsic_R: [ 0., -1., 0., 
                1., 0., 0., 
                0., 0., 1.]
  pub_step: 10                     # 发布间隔帧数
  # ===== 输出控制 =====

  # ===== 性能评估 =====
  timer: false                      # 是否输出耗时统计
fasterlio:
  time_offset: 0          # imu 时间偏移，用于时间校准
g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -0.5
  min_th_floor: 0.3
  max_th_floor: 1.5
  grid_map_resolution: 0.2

system:
  use_super_lio: true               # 启用 SuperLIO 前端
  with_loop_closing: true
  with_ui: true
  with_2dui: false
  with_g2p5: true
  step_on_kf: false
  enable_lidar_loc_skip: true
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 1
  lidar_odom_skip_num: 2
  map_path: ./data/ad68517c-e845-42a4-b5dd-a6b7c6d2af13/
  pub_tf: false
  with_ins: true
  ins_only_mode: true
  #五云湖
  # ins_lat: 29.6804415437268
  # ins_lon: 106.36709211071863
  # ins_height: 263.54041310015486
  #超级工厂
  ins_lat:  29.731405029387507
  ins_lon: 106.78389112052452
  ins_height: 255.13379845420422
  extrinsic_T: [ 0.132, 0.0, 0.0]   ## body -  imu
  extrinsic_R: [ 1., 0., 0., 
                0., 1., 0., 
                0., 0., 1.]
  init_t: [ -636.808 , 736.707 , 0.143067]   
  init_r: [ 1., 0., 0., 
                0., 1., 0., 
                0., 0., 1.]        
loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true
  with_ins_prior: true
  ins_trans_noise: 1.0
  ins_rot_noise: 0.523599 #3.0 * M_PI / 180.0
  use_ins_covariance: false
  ins_prior_position_only: false  # 如果为 true，只约束位置，不约束姿态

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: false
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: false
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: false
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0

ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
