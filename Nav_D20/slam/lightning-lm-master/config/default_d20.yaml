# 针对NCLT的配置
common:
  dataset: "nclt"
  lidar_topic: "/robot/topic/rdap/top_point_cloud2" # "/lidar_points" 
  imu_topic: "/rte/rdap/rtk/imus/data_raw"
  ins_topic: "/bynav/inspvax"
  livox_lidar_topic: "/livox/lidar1111"
  bestgnsspos_topic: "/bynav/bestgnsspos"
  # 组合导航类型: "novatel"(旧组合导航, novatel_oem7_msgs/INSPVAX) 或 "kygi665"(新组合导航, kygi665_msgs/INSPVAX)
  ins_type: "kygi665"
  # kygi665 组合导航话题(当 ins_type 为 "kygi665" 时使用, IMU 统一使用 imu_topic)
  kygi665_ins_topic: "/rte/rdap/rtk/inspvax"
# fasterlio 参数
fasterlio:
  lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for hesai
  scan_line: 32
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效
  time_offset: 0          # imu 时间偏移，用于时间校准

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 6 # 点云采样参数
  max_iteration: 4 # 最大迭代次数
  filter_size_scan: 0.5 # 对scan进行的降采样
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  ###    D10
  # extrinsic_T: [ 0.00637, 0.1512209, 0.0658145] 
  # extrinsic_R: [ -1., 0., 0., 
  #                 0., -1., 0., 
  #                 0., 0., 1.]
  # D20 A1
  # extrinsic_T: [ 0.4594, 0.0, 0.0516] 
  # extrinsic_R: [ 0., -1., 0., 
  #               1., 0., 0., 
  #               0., 0., 1.]
  # D20 A2
  extrinsic_T: [ -0.0213, 0.18, 0.009] 
  extrinsic_R: [ -1., 0., 0., 
                0., -1., 0., 
                0., 0., 1.]

   #extrinsic_R: [ 0., 1., 0., 
   #             -1., 0., 0., 
   #             0., 0., 1.]
  keep_first_imu_estimation: false


g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -0.7   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率

system:
  use_super_lio: false               # 启用 SuperLIO 前端
  with_loop_closing: true # 是否需要回环检测
  with_ui: true # 是否需要3D UI
  with_2dui: false # 是否需要2D UI
  with_g2p5: true # 是否需要栅格地图
  step_on_kf: false # 是否在关键帧处暂停
  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: /opt/seres/nav/data/ad68517c-e845-42a4-b5dd-a6b7c6d2af13
  pub_tf: true
  with_ins: true
  ins_only_mode: false # INS直出模式: 不运行LIO和激光定位, 直接用INS位姿发布odom
  publish_map_cloud: false # 是否发布地图点云
  publish_occ_grid: false
  #超级工厂
  ins_lat:  29.731405029387507
  ins_lon: 106.78389112052452
  ins_height: 217.1952074889191
  #五云湖
  # ins_lat: 29.6804415437268
  # ins_lon: 106.36709211071863
  # ins_height: 263.54041310015486
  # D20 A1
  # extrinsic_T: [ 0.132, 0.0, 0.0]   ## imu2body
  # extrinsic_R: [ 1., 0., 0., 
  #               0., 1., 0., 
  #               0., 0., 1.]
  # D20 A2
  extrinsic_T: [ 0.13898, 0.02129, 0.134]   ## imu2body
  extrinsic_R: [ 0., 1., 0., 
                -1., 0., 0., 
                0., 0., 1.]

  init_t:   [ -456.329 ,  679.281 ,0.0775522]  #[  -109.89054801282  , 400.61349477412 ,-0.31035993351074]
  init_r: [ 1., 0., 0., 
                0., 1., 0., 
                0., 0., 1.]           
loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 30.0       # 候选帧的最大距离
  ndt_score_th: 1.0     # ndt位姿分值
  with_height: false
  motion_trans_noise: 0.05            # 位移权重 (运动约束)
  motion_rot_noise: 0.0052            # 旋转权重 (运动约束), 3.0 * M_PI / 180.0
  with_ins_prior: true
  ins_trans_noise: 1.0
  ins_rot_noise: 0.052 #3.0 * M_PI / 180.0
  use_ins_covariance: false
  ins_prior_position_only: true  # 如果为 true，只约束位置，不约束姿态

### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: false
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -10.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 36
  lidar_loc_odom_th: 0.5
  init_with_fp: false
  min_init_confidence: 2.0
  update_dynamic_cloud: false
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: false
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 2
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
