syntax = "proto3";


package srcp.skill.args;   // seres remote control protocal

import "nav_operation.proto";
import "task_args.proto";

// ----------------------------------------------- SkillFocusRequest --------------------------------------------------- //

// 获取所有技能, 参数暂时为空
message QueryAllSkills {

}

message ConfigureOptions {
    // 探测服务端和客户端是否存活的策略
    enum LivenessProbeType {
        PID = 0;             // 通过监听pid来（旧版本）
        HEARTBEAT = 1;       // 通过心跳机制（支持跨设备）
    }
    int32 res_priority = 1;
    int32 pid = 2;
    LivenessProbeType probe_type = 3;
    string client_flag = 4;
    bool enable_task_callback = 5;      // enable任务的MSG_TYPE_TASK_STATE/MSG_TYPE_TASK_EVENT回调
}

// 技能信息
message SkillInfo {
    string skill = 1;
    int32 resource_bitmask = 2;                  // 占用的资源
}

// 获取所有技能的结果
message QueryAllSkillResult {
    int32 body_resource_bitmask = 1;        // 全身资源
    repeated SkillInfo skills = 2;          // 每个技能所占有的焦点的集合
}

// 获取模块ROS2地址的结果
message ConfigureResult {
    string token = 1;
    string publish_topic_addr = 2;          // 调用者发布给robot service的topic地址
    string subscribe_topic_addr = 3;        // 订阅来自robot service的topic地址
    string focus_status_topic_addr = 4;     // 焦点状态变化topic
    int32 server_pid = 5;                   // 服务端的进程ID
}

message SkillTask {
    string task_id = 1;
    string conn_token = 2;
    int32 focus = 3;
    int32 task_state = 4;
    int64 timestamp = 5;
}

message RunningTaskList {
    repeated SkillTask tasks = 1;
}

// 任务事件
message SkillTaskEvent {
    enum TaskEvent {
        TASK_EVENT_READY = 0;    // 任务准备就绪了（进入队列等待执行）
        TASK_EVENT_START = 1;    // 任务开始执行了
        TASK_EVENT_START_SUCCESS = 2;   // 任务开始成功
        TASK_EVENT_START_FAILED = 3;    // 任务开始失败
        TASK_EVENT_END = 4;             // 任务执行结束
    }
    TaskEvent event = 1;                // 任务事件
    string task_id = 2;                 // 任务ID
    string skill = 3;                   // 任务技能
}

enum Direction{
    LEFT = 0;
    RIGHT = 1;
}

message MoveCommand {

}

message MoveFeedback {

}

message MoveResult {
    
}

// 灵巧抓取的参数
message HandGrasp {
    string good = 1;          // 物品
    string prompt = 2;        // 语意

    // 物品ID, 不是必传, 通常在有多个目标物时才传入，例如有多个水杯时，good_id表示要拿取的目标物id;
    // 如果不传, 由算法自行决定拿哪一个目标物; 这个ID通常是算法的感知模块输出
    oneof good_id {
        int32 int_good_id = 3;  // int类型的物品ID
        string str_good_id = 4; // string类型的物品ID
    };
}

message RelocationManual {

}

// {"left_arm":0,"right_arm":0,"left_hand":1,"right_hand":0,"head":0}
enum UpperJointMask {
    DEFAULT = 0;    // 默认, 表示按
    LEFT_ARM = 1;   // 1 << 0
    RIGHT_ARM = 2;  // 1 << 1;
    LEFT_HAND = 4;  // 1 << 2;
    RIGHT_HAND = 8; // 1 << 3;
    HEAD = 16;      // 1 << 4;
}

message ResetBody {
    int32 upper_joint_mask = 1;  // 上肢关节掩码, 当重置类似是上肢时会读取这个参数, 值为0时表示重置全部上肢;
}

// 单手比出半颗心
// （机器人手臂弯曲并跨至胸前，四指聚拢向下，拇指向内弯曲，形成半心形手势。
// 在与用户互动时，通过与用户的半心手势配合，共同构成完整心形图案。为增强生命感，可结合身体整体的轻微倾斜姿态）
message HalfHeartShapeAtChest {
    srcp.args.HandRes hand = 1; // 左手或右手
}

enum NavCalibType {
    SINGLE = 0;              // 单传感器标定
    PAIR = 1;                // 双传感器联合标定 
}
message DeviceCalibInfo {
    enum CalibState {
        NONE = 0;                // 未标定
        SUCCESS = 1;             // 标定成功
        FAILED = 2;              // 标定失败
        NOT_NEED = 3;            // 无需标定
        CALIBING = 4;            // 标定中
        DATA_COLLECTING = 5;     // 数据采集中
        DATA_COLLECTED = 6;      // 数据采集完成
        DATA_COLLECT_FAILED = 7; // 数据采集失败
    }

    enum DeviceType {
        TYPE_NONE = 0;           // 占位枚举
        CAMERA = 1;              // 普通相机
        CAMERA_DEPTH = 2;        // 深度相机
        LIDAR = 3;               // 激光雷达
        UWB   = 4;               // UWB
        IMU   = 5;
        ULTRASONIC_RADAR = 6;    // 超声波雷达
    }
    string device_name = 1;      // 标定设备名
    int32 device_id = 2;         // 标定设备ID
    int32 calib_state = 3;       // 标定状态
    int64 calib_timestamp = 4;   // 标定时间戳
    int32 calib_type = 5;        // 标定类型
    repeated int32 ids = 6;      // calib_type为PAIR时传入, 参数是联合标定的传感器ID
}

// NAV_CALIBATION_LIST
message NavCalibrationInfo {
    repeated DeviceCalibInfo device_calib_list = 1;
}

message ExplorePoint {
    string map_uuid = 1;
    string message = 2;
    repeated Point points = 3;
}

message NavCalib {
    repeated int32 device_ids = 1;
    int32 calib_type = 2;
    string param = 3;
}

message NavCalibFeedback {
    // 标定进展
    enum CALIB_PROGRESS {
        START = 0;              // 标定开始
        STOP = 1;               // 标定结束
        DOING = 2;              // 标定中
    };

    int32 calib_total = 1;      // 标定的设备总数
    int32 calib_idx = 2;        // 标定的索引, 从0开始计数; 例如标定5个设备, 那么idx从0,1,2, 3, 4,
    int32 calib_progress = 3;   // 标定进展, 开始、结束
    DeviceCalibInfo info = 4;   // 标定信息
}

message NavCalibData {
    int32 device_id = 1;
    string result = 2;
    int32 crc16 = 3;            // 标定数据的crc16校验码, 0xFFFF & crc16可以得到校验码
}
message NavCalibResult {
    repeated NavCalibData datas = 1;
}


message FollowImage {
    string format = 1;
    bytes data = 2;
}

message BoundingBox {
    int32 id = 1;           //目标唯一跟踪ID
    string class_name = 2;  //类别标签（如 "person"）详见感知目标类型定义 
    float score = 3;      //置信度 [0..1]
    
    //中心点（x,y）+ 旋转角 theta（通常0）
    double center_x = 4;
    double center_y = 5;
    double center_theta = 6;
    float size_x = 7;  //宽度（像素）
    float size_y = 8;  //高度（像素）
}

message FollowObject {
    enum FollowMode {
        FOLLOW_MODE_AUTO = 0;    //跟踪当前正对目标
        FOLLOW_MODE_UWB = 1;     //UWB目标信标跟随
        FOLLOW_MODE_PIC = 2;     //目标图像跟随
        FOLLOW_MODE_BOX = 3;     //目标框对象跟随
    }
    enum FollowPeriod {
        FOLLOW_PERIOD_CONTINUE = 0;    //持续跟随
        FOLLOW_PERIOD_ONCE     = 1;    //单次跟随，到达目标跟随范围后即完成
    }
    enum PlanMode {
        PLAN_MODE_AUTO     = 0;     //自动规划路径
        PLAN_MODE_PATH     = 1;     //按指定路径跟随
        PLAN_MODE_SURROUND = 2;     //环绕跟随
        PLAN_MODE_LINE     = 3;     //直线跟随，跟随目标直进直退
    }
    FollowMode mode = 1;
    FollowPeriod period = 2;
    PlanMode planMode = 3;
    float speed = 4;                 //跟随速度，有效值：大于0
    repeated FollowImage images = 5; //目标对象，mode为FOLLOW_MODE_PIC时有效
    BoundingBox box = 6;             //目标框对象，mode为FOLLOW_MODE_BOX时，有效
    int32 distance = 7;              //距离，单位cm。PLAN_MODE_SURROUND时为环绕距离
    repeated Point point = 8;        //跟随路径，PLAN_MODE_PATH时有效
    int32 follow_id = 9;             //目标唯一2D跟踪ID
}

// 安全守卫: 守卫轨迹/区域/地图边缘, 危险源进入守卫范围时触发告警
message SafetyGuard {
    enum GuardMode {
        GUARD_MODE_TRAJECTORY = 0;   //轨迹守卫: 守卫给定轨迹
        GUARD_MODE_REGION     = 1;   //区域守卫: 守卫给定多边形区域
        GUARD_MODE_MAP_EDGE   = 2;   //地图边缘守卫: 守卫地图边界, points 留空
    }
    GuardMode mode = 1;                  //守卫模式
    string map_uuid = 2;                 //所属地图
    repeated Point points = 3;           //守卫几何: 轨迹守卫=轨迹点串; 区域守卫=多边形顶点(按序连线闭合); 地图边缘守卫忽略
    repeated string hazard_sources = 4;  //危险源类别: 如 "person", "animal"; 空: 全部
    int32 patrol_duration_sec = 5;       //巡逻时长(s): 0=沿路线走一整圈(回到进入点)后结束; >0=限时巡逻(走满时长后在顶点收尾结束); -1=无限巡逻; 不传默认0
}

message SpinningOnTheSpot {
    enum SpinMode {
        SKILL_ID_ROTATE = 0;    //原地旋转, parm转角度[-pi,+pi], 负数为向右，正数为向左
        SKILL_ID_MOVE_DIS = 1;  //移动距离, parm:角度[-pi,+pi],距离(m)
    }
    SpinMode mode = 1;
    repeated float para = 2;
    // todo: 这两个direction和avoid_obstacles是优奇算法使用的, 暂定参数是这两个; 后面可能会修改
    Direction direction = 3;
    srcp.args.AvoidObstacles avoid_obstacles = 4;
}

message PTZCamera {
    enum SensorMode {
        SENSOR_CAMERA_RGB = 0;
        SENSOR_CAMERA_THERMA = 1;    // 热红外相机
    }

    SensorMode mode = 1;         //传感器编号, SensorMode
    Point targetPoint = 2;       //目标位置
    Point targetScale = 3;       //目标大小, 长宽高
    float imgScale = 4;          //目标在图像中的比例 0~1
}

message Joint {
    int32 id = 1;   //jointid, id定义见URDF及设备属性描述文件
    float q = 2;    //rad
    float dq = 3;   //rad/s
    float tau =4;   //N/m
    float kp = 5;   //刚性系数
    float kd = 6;   //阻尼系数
}

message JointsControl {
    repeated Joint joints = 1;
}

message MotorCalibInfo {
    string motor_name = 1;          // 电机描述
    int32 motor_id = 2;             // 电机ID
    int32 zeroing_state = 3;        // 标0状态; 0表示未标定/1表示已标定或标定成功/2表示标定失败
    int32 set_kp_state = 4;         // 刚性系数标定状态; 0表示未标定/1表示已标定或标定成功/2表示标定失败
    int32 set_kd_state = 5;         // 阻尼系数标定状态; 0表示未标定/1表示已标定或标定成功/2表示标定失败
    double kp_min = 6;              // 刚性系数最小值
    double kp_max = 7;              // 刚性系数最大值
    double kd_min = 8;              // 阻尼系数最小值
    double kd_max = 9;              // 阻尼系数最大值
    int64 zeroing_timestamp = 10;   // 标0时间戳
    int64 set_kp_timestamp = 11;    // 刚性系数设置时间戳
    int64 set_kd_timestamp = 12;    // 阻尼系数设置时间戳
    double pos_threshold_min = 13;      // 位置标定最小值
    double pos_threshold_max = 14;      // 位置标定最大值
    int32 pos_threshold_state = 15;     // 位置标定状态，0表示未标定/1表示已标定或标定成功/2表示标定失败
    int64 pos_threshold_timestamp = 16; // 位置标定时间戳
}

enum MotorCalibCapability {
    CAP_DEF                 = 0;       // 默认, 主要是兼容旧版本接口, 为0时全部显示支持即可; 大于0时再根据掩码计算支持情况
    CAP_ZEROING_ALL         = 1;       // 1 << 0; 整机标0
    CAP_ZEROING             = 2;       // 1 << 1; 指定电机ID标0
    CAP_SET_KP_ALL          = 4;       // 1 << 2; 整机设置kp
    CAP_SET_KP              = 8;       // 1 << 3; 指定ID设置kp
    CAP_SET_KD_ALL          = 16;      // 1 << 4; 整机设置kd
    CAP_SET_KD              = 32;      // 1 << 5; 指定ID设置kd
    CAP_POS_THRESHOLD_ALL   = 64;      // 1 << 6; 整机位置值标定
    CAP_POS_THRESHOLD       = 128;     // 1 << 7; 位置值标定
}

message MotorCalibResult {
    repeated MotorCalibInfo motor_calibs = 1;
    // 添加上电机标定能力
    uint32 capabilities = 2;
}

message MotorCalibParam {
    int32 motor_id = 1;           // 电机ID
    double min = 2;               // 最小值
    double max = 3;               // 最大值
}

enum MotorCalibType{
    ZEROING_ALL = 0;                // 电机整机标0
    SET_KP_ALL = 1;                 // 设置所有电机的刚性系数
    SET_KD_ALL = 2;                 // 设置所有电机的阻尼系数
    ZEROING = 3;                    // 指定电机标0
    SET_KP = 4;                     // 设置指定电机的刚性系数
    SET_KD = 5;                     // 设定指定电机的阻尼系数
    POS_THRESHOLD_ALL = 6;          // 整机位置值标定, 需要传入整机电机的限位参数
    POS_THRESHOLD = 7;              // 指定电机位置值标定, 需要传入电机的限位参数
}
message MotorCalib {
    MotorCalibType type = 1;

    // 整机标0时params不需要传;
    // 整机设置kp/kd值时, 只需要传入一个param, 里面包含min, max即可，不用指定motor_id
    // 指定电机标0时, 需要传至少一个param, 参数包含motor_id即可
    // 设置指定电机kp/kd值时，需要传入至少一个param, motor_id, min, max都需要设置
    repeated MotorCalibParam params = 2;
}

message MotorCalibFeedback {
    MotorCalibType type = 1;    // 标定的类型
    int32 calib_total = 2;      // 标定的设备总数
    int32 calib_idx = 3;        // 标定的索引, 从0开始计数; 例如标定5个设备, 那么idx从0,1,2, 3, 4,
    int32 calib_progress = 4;   // 标定进展, 开始(0)、结束(1)
    MotorCalibInfo info = 5;    // 标定信息
}

// 向前走向后走，左转右转的运控控制参数
// 向前向后走: speed表示行走的速度(m/s), value表示行走的距离(m)
// 左转右转：speed表示旋转的叫速度(degree/s), value表示旋转的角度(degree)
message MotionCommand {
    double speed = 1;            // 速度: m/s
    double value = 2;            // 角度或者距离 
}

// 腰部控制
message WaistControl {
    enum Mode {         
        TWIST_WAIST = 0;         // 弯腰 
        SIDEBEND_WAIST = 1;      // 侧腰
    }
    Mode mode = 1;              // 模式
    float degree = 2;           // 角度
}

// 鞠躬
message Bow {
    float degree = 1;
}

// 优奇小脑算法原子能力
message ForearmAction {
    enum Mode {
        // ForearmRotation = 0;             // 小臂旋动（前臂以肘关节为轴做内旋/外旋）
        FOREARM_ROTATION = 0;
        // ForearmExtension = 1;            // 小臂前伸（肘关节展开使前臂远离上臂）
        FOREARM_EXTENSION = 1;
        // ArmPendulumSwing_SingleArm = 2;
        ARMPENDULUMSWING_SINGLEARM = 2;     // 单臂钟摆式摆动（单臂在冠状面绕肩关节做钟摆式运动）
    }

    Mode mode = 1;     // 模式
    srcp.args.HandRes hand = 2;  // 手指编号
    float degree = 3;  // 目标角度
}

// {"hand_number":0,"finger_number":0,"pose":{"point":[x,y,z],"yaw":[x,y,z,w]},"Intensity":1 }
message FingerTap_SingleHand {
    srcp.args.HandRes hand = 1;  // 灵巧手编号
    repeated int32 finger_number = 2; // 手指编号
    srcp.args.PointOrientation point_orientation = 3;  // 目标点
    int32 intensity = 4;  // 点击力度 单位: 牛顿
}

message TerminatingCurrentTask {

}

message StandUpFromSquatting {

}

message StandUpFromSitting {

}

message SteppingOnTheSpot {

}

message TiltHead {
    
}

// {"hand_number":0,"finger_number":0}
message FingerPointing_FixedPose {
    srcp.args.HandRes hand = 1;  // 灵巧手编号
    int32 finger_number = 2;     // 使用哪只手指
}

// 手部动作
message HandAction {
    enum Type {
        // 单手张开手指（单手五指自然张开，掌心朝前，表示开放或友好）
        OpenFingers_SingleHand = 0;
        // 单手聚指邀招（单手手指靠拢；手臂向前伸出，掌心朝上，做招手动作，重复三次）
        FingersTogetherForwardBeckon = 1;
        // 单手手掌下压（单手手掌向下，做下压动作，重复三次）
        PalmPushDown_SingleHand = 2;
        // 单手压掌前送（单手手臂向前平伸，掌心向下，做推进动作，重复三次）
        PressPalmDownPushForward_SingleHand = 3;
        // 单手招呼进入（单手手掌向前推进后回收，重复数次，表示“请进”，重复三次）
        InvitingInGesture_SingleHand = 4;
        // 握拳点赞（单手拇指向上，其余手指握拳，表示认同或鼓励）
        ThumbsUp_SingleHand = 5;
        // 单手拢指握拳（单手五指弯曲收拢，模仿握紧物体的动作）
        MakingFist_SingleHand = 6;
        // 碰拳（单手握拳，举至胸前，拳面朝前，与他人拳头轻触）
        FistBump_FixedPose = 7;
        // 击掌（单手快速上扬，与他人手掌击打，表示庆祝或配合）
        HighFive_FixedPose = 8;
        // 单手OK手势（单手拇指与食指指尖相触成圈，其余三指自然伸直，手心朝外）
        OKGesture_SingleHand = 9;
        // 单手停止手势（一只手抬起，掌心朝前，五指并拢竖直举止，呈“停”或“暂停”姿态）
        StopGesture_SingleHand = 10;
        // 单手石头手势（单手五指握拳，手背朝外，拳心朝内）
        RockGesture_SingleHand = 11;
        // 单手剪刀手势（单手食指和中指伸出呈V字，其余手指握拳，手心朝外）
        ScissorsGesture_SingleHand = 12;
        // 单手布手势（五指并拢伸直，掌心朝下，手指自然张开）
        PaperGesture_SingleHand = 13;
        // 讲解动作-指向上方（一只手臂抬起，食指竖直向上，其余手指握拳，指尖朝天）
        ExplanationGesture_PointingUp = 14;
        // 讲解动作-指向下方（手臂自然下垂或略向前伸，食指向下伸出，其余手指握拳，指尖朝地面）
        ExplanationGesture_PointingDown = 15;
        // 讲解动作-指向左侧（左臂平举，食指伸出，其余手指握拳，手腕带动指尖指向左侧）
        ExplanationGesture_PointingLeft = 16;
        // 讲解动作-指向右侧（右臂平举，食指伸出，其余手指握拳，手腕带动指尖指向右侧）
        ExplanationGesture_PointingRight = 17;
        // 展示单手手掌背面（单手手背朝外举起，五指伸直，强调手部反面）
        ShowPalmBack_SingleHand = 18;
    }
    srcp.args.HandRes hand = 1;  // 灵巧手编号
    Type type = 2;
}

message InitialLocateAuto {
    string map_uuid = 1;
}

message VLNPathPlanningForNav {
    string prompt = 1;
}

enum MapCMD {
    MAP_CMD_ADD = 0;
    MAP_CMD_DELETE = 1;
    MAP_CMD_START_MAPPING = 2;
}

message MapOperate {
    MapCMD cmd = 1;         // 指令，支持MAP_CMD_ADD-导入地图; MAP_CMD_DELETE-删除地图
    string map_uuid = 2;    // 地图UUID
    string content = 3;     // MAP_CMD_ADD时传入url; MAP_CMD_DELETE时不需要传入
    string map_md5 = 4;     // 地图的md5签名，下载地图时会使用md5值进行校验; 删除地图时不需要传
}

message MapOperateFeedback {
    enum MapOpState {
        MAP_OP_STATE_DOING = 0;     // 开始操作
        MAP_OP_STATE_SUCCESS = 1;   // 执行成功
        MAP_OP_STATE_FAILED = 2;    // 执行失败
    }

    string map_uuid = 1;            // 地图UUID
    MapOpState map_op_state = 2;    // 地图操作的反馈
    string message = 3;             // 信息，失败时通过这个反馈错误原因
}

message MapEstablishment {

}

message ElectronicFenceMarkManual {
    string map_uuid = 1;
    string map_path = 2;
}

message ShakeEars {
    // 摇耳朵的动作类型
    enum EarsActionType {
        BASIC = 0;              // 基础动作(交替摇耳朵),废弃
        FLAP_ALTERNATE = 1;     // （周期动作）双耳交替煽动
        AIRPLANE = 2;           // （单次动作）飞机耳
        RESPIRATORY_RHYTHM = 3; // （周期动作）双耳呼吸律动
        ERECT = 4;              // （单次动作）双耳前倾竖立
        VIBRATION_FORWARD = 5;  // （单次动作）双耳前倾微颤
        RETRACT_SLOWLY = 6;     // （单次动作）双耳缓缓下垂
        RETRACT_WHOLLY = 7;     // （单次动作）双耳完全收起
        RETRACT_HALF = 8;       // （单次动作）双耳稳态半收
        ROTATE_ALTERNATE = 9;   // （周期动作）双耳交替转动
        RETRACT_RAPID = 10;     // （单次动作）双耳快速收起
        ERECT_INDEPENDENT = 11; // （单次动作）单耳独立竖起
        OPEN_GENTLY = 12;       // （单次动作）双耳平缓张开
        VIBRATION_CLOSE = 13;   // （周期动作）双耳紧贴颤动
        FLAP_ALTERNATE_QUICK = 14;    // （周期动作）双耳交替扇动
        JUMP_RESET = 15;        // （单次动作）双耳弹跳复位
        INSTANT_REAR_BOUNCE = 16; // （单次动作）双耳瞬间后弹
        DODGE = 2026;               // （单次动作）单耳后撇闪避, para[0]:左耳：1.0；右耳：2.0，其他无效
    }

    enum EarsType {
        LEFT_EARS = 0;
        RIGHT_EARS = 1;
    }
    srcp.args.RepeatMode mode = 1;    // 是执行一次，还是循环执行
    float interval_time = 2;          // 周期执行时，两次执行的间隔时间，单位是秒
    EarsActionType type = 3;          // 执行的耳朵控制类型
    EarsType earsType = 4;            // 耳朵类型，左耳或右耳; 双耳动作时这个参数不用设置
    bool finish_after_once = 5;       // 单次动作执行完成时，是否自动停止任务;
}

