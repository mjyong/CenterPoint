// 耳朵标定类型(暂只支持同时标定上下限, 仅上限/仅下限类型待底软接口定稿后扩展)
enum EarsCalibType {
    EARS_CALIB_TYPE_THRESHOLD = 0;  // 同时标定上下限
}

// 耳朵标定操作(同时标定类型下使用)
enum EarsCalibOperation {
    EARS_CALIB_OP_QUERY_POSITION = 0;   // 查询电机位置(人工扳动耳朵到限位后调用, 需调用两次分别对应上/下限)
    EARS_CALIB_OP_EXECUTE_CALIB = 1;    // 执行标定(两次位置查询成功后调用)
}

// 耳朵标定(双耳整体)
message EarsCalib {
    EarsCalibType type = 1;         // 标定类型, 缺省为同时标定上下限
    EarsCalibOperation operation = 2; // 操作参数: 0查询电机位置/1执行标定
}

// 耳朵标定单个电机信息
message EarsCalibMotorInfo {
    string motor_name = 1;          // 电机描述(LE/RE)
    int32 motor_id = 2;             // 电机ID
    int32 calib_state = 3;         // 标定状态; 0未标定/1成功/2失败
    double position_min = 4;       // 位置下限(标定成功后查询填充, 查询失败为0)
    double position_max = 5;       // 位置上限(标定成功后查询填充, 查询失败为0)
    int64 calib_timestamp = 6;     // 标定时间戳
}

// 耳朵标定反馈
message EarsCalibFeedback {
    int32 calib_total = 1;          // 标定电机总数
    int32 calib_idx = 2;            // 当前反馈电机索引, 从0开始
    int32 calib_progress = 3;      // 进展: 开始(0)/结束(1)
    EarsCalibMotorInfo info = 4;    // 电机标定信息
}

// 焦点暂停的信息
