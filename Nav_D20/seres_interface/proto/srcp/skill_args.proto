}

// 头部姿态控制，将头部转到对应的角度
// 如果reset_flag不为0时，优先重置
message HeadPoseControl {
    float yaw = 1;          // 左转右转(-PI, PI)(左， 右)的弧度，Yaw（偏航角）：确实表示左右方向，即绕垂直轴（Z轴）旋转; 为0时表示不修改这个角度值
    float pitch = 2;        // 表示上下方向(-PI, PI)(上，下)，即绕水平横轴旋转; 为0时表示不修改这个角度值
    float roll = 3;         // 横滚角(-PI, PI)(低头，抬头); 为0时表示不修改这个角度值
    int32 reset_flag = 4;   // 重置角度的标志位, 0b1表示重置yaw角, 0b10表示重置pitch, 0b100表示重置roll
}
// 头部姿态控制
message HeadPoseControlFeedback {
    repeated float yaw_limit = 1;     // {-yaw, yaw} 限位角度
    repeated float pitch_limit = 2;   // {-pitch, pitch} 限位角度
    float target_yaw = 3;             // 目标偏航角度
    float target_pitch = 4;           // 目标俯仰角度
    float cur_yaw = 5;                // 当前的偏航角度
    float cur_pitch = 6;              // 当前的俯仰角度
    repeated float roll_limit = 7;    // {-roll, roll} 限位角度
    float target_roll = 8;            // 目标的roll角度
    float cur_roll = 9;
}

