// 
// https://sai-seres.feishu.cn/wiki/SEOPwZ7jDinVgak94aJcD97undX?sheet=D4YogZ: 电机故障掩码
// 故障码格式: 0x0106NNXX, 其中 NN 为节点号, 此处统一用 00 代替
enum MotorFaultMask {
  MOTOR_FAULT_MASK_UNSPECIFIED = 0;                       // 未指定/无故障

  MOTOR_FAULT_MASK_LINK_ABNORMAL = 0x01060001;            // 链路异常: 无法控制或访问外设
  MOTOR_FAULT_MASK_DATA_ABNORMAL = 0x01060002;            // 数据异常: 能接收到数据，但是无法正确识别
  MOTOR_FAULT_MASK_OVER_TEMPERATURE = 0x01060003;         // 温度过高: 温度超过阈值
  MOTOR_FAULT_MASK_OVER_VOLTAGE = 0x01060004;             // 电压过高: 输入电压过压
  MOTOR_FAULT_MASK_OVER_CURRENT = 0x01060005;             // 电流过高: 输入电流过流
  MOTOR_FAULT_MASK_VERSION_MISMATCH = 0x01060006;         // 版本不匹配: 固件版本不匹配
  MOTOR_FAULT_MASK_ENCODER_FAULT = 0x01060007;            // 编码器故障: 位置或速度反馈传感器失效
  MOTOR_FAULT_MASK_MOTOR_FAULT = 0x01060008;              // 电机故障: 电机故障
  MOTOR_FAULT_MASK_SHORT_CIRCUIT = 0x01060009;            // 短路: 电路短路
  MOTOR_FAULT_MASK_UNDER_VOLTAGE = 0x0106000A;            // 欠压: 电压欠压
  MOTOR_FAULT_MASK_MOTOR_STALL = 0x0106000B;              // 电机堵转: 电机堵转
  MOTOR_FAULT_MASK_PRE_DRIVER_FAULT = 0x0106000C;         // 预驱故障: 预驱故障
  MOTOR_FAULT_MASK_CAN_COMM_FAULT = 0x0106000E;           // CAN通讯故障: 连续两帧控制报文间隔时间超过500ms
  MOTOR_FAULT_MASK_LEVEL3_OVER_TEMP_PROTECTION = 0x01060010; // 三级过温保护
  MOTOR_FAULT_MASK_STEP_PROTECTION = 0x01060011;          // 阶跃保护: Iq(k)-Iq(k-1) > 阈值
  MOTOR_FAULT_MASK_OVERLOAD_PROTECTION = 0x01060012;      // 过载保护(相电流过流故障)
  MOTOR_FAULT_MASK_ACTUATOR_DISABLED = 0x01060013;        // 执行器失能
  MOTOR_FAULT_MASK_ACTUATOR_CONTROL_TIMEOUT = 0x01060014; // 执行器控制超时
  MOTOR_FAULT_MASK_LEVEL2_OVER_TEMP_PROTECTION = 0x01060015; // 二级过温保护
  MOTOR_FAULT_MASK_LEVEL1_OVER_TEMP_PROTECTION = 0x01060016; // 一级过温保护
}

message MotorFault {
    int32 motor_id = 1;
    MotorFaultMask motor_fault_mask = 2;
}

// 任务覆盖的信息
message MotorFaultInfo {
    repeated MotorFault motor_faults = 1;
}