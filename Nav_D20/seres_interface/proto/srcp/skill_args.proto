// 导航/跟随/前进距离 状态反馈
enum NavState {
    NAV_STA_TASK_EXEC_SUCCESS    = 0;         // 任务执行成功
    NAV_STA_TASK_EXEC_FAILED     = 1;         // 任务执行失败
    NAV_STA_TASK_EXEC_DOING      = 2;         // 任务执行中

    NAV_STA_MAP_DOING            = 1001;       // 建图中
    NAV_STA_MAP_LOAD_FAILED      = 1002;       // 地图加载失败

    NAV_STA_NAVGATING            = 2001;       // 导航中
    NAV_STA_EXPLORING            = 2002;       // 探索中 
    NAV_STA_PLAN_DOING           = 2011;       // 路径规划中
    NAV_STA_PLAN_DONE            = 2012;       // 路径规划完成
    NAV_STA_PLAN_PATH_FAILED     = 2013;       // 路径规划失败
    NAV_STA_MAP_UNMATCHED        = 2014;       // 导航下发的map_uuid不匹配

    NAV_STA_OBSTACLE_WAY         = 3001;      // 路径遇障碍
    NAV_STA_OBSTACLE_AVOIDING    = 3002;      // 避障中
    NAV_STA_OBSTACLE_FAILED      = 3003;      // 绕障失败
    NAV_STA_OBSTACLE_SUCCESS     = 3004;      // 绕障成功

    NAV_STA_RELOCATION_FAILED    = 4001;      // 重定位失败

    NAV_STA_FOLLOW_DOING         = 5001;      // 跟随中
    NAV_STA_FOLLOW_OBJ_LOST      = 5002;      // 跟随目标丢失
    NAV_STA_FOLLOW_OBJ_MISMATCH  = 5003;      // 跟随目标不匹配

    NAV_STA_STAKE_NOT_FOUND      = 6001;      // 充电桩未找到
    NAV_STA_STAKE_TO_FAILE       = 6002;      // 回桩失败

    NAV_STA_GUARD_DOING          = 7001;      // 守卫中
    NAV_STA_GUARD_TRIGGERED      = 7002;      // 守卫触发(危险源进入守卫范围)
    NAV_STA_GUARD_CLEAR          = 7003;      // 守卫恢复(危险源离开守卫范围)
    NAV_STA_GUARD_FAILED         = 7004;      // 守卫任务失败
}

