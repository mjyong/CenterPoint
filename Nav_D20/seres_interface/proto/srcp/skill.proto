syntax = "proto3";

package srcp.skill;
import "task_args.proto";
import "skill_args.proto";

//-----------------------------------------------------------------------------------------

// 技能执行状态
enum SkillTaskState {
    READY = 0;              // 准备就绪, 等待执行
    RUNNING = 1;            // 执行中
    CANCELING = 2;          // 取消中
    PAUSED = 3;             // 暂停
    PENDING_RESUME = 4;     // 等待恢复
}

// 操作返回值
enum SkillRet{
    RET_OK = 0;                     // 成功
    RET_BUSY = 1;                   // 被高优模块占用
    RET_STR = 2;                    // 休眠模式申请焦点失败，或进休眠模式时丢失焦点
    RET_STAGNANT = 3;               // 僵停中
    RET_UNSUPPORT_SKILL = 4;        // 不支持的技能
    RET_UNSUPPORT_MODEL = 5;        // 不支持模块
    RET_UNSUPPORT_FOCUS = 6;        // 不支持的焦点
    RET_FAILED = 7;                 // 失败, 例如在执行技能过程触发释放焦点, 直接返回失败
    RET_FOCUS_NOT_MATCHED = 8;      // 焦点不匹配
    RET_INVALID_PARAM = 9;          // 请求参数无效
    RET_UNSUPPORT = 10;             // 不支持的操作
    RET_OFFLINE = 11;               // 服务端不在线
    RET_TIMEOUT = 12;               // 超时
    RET_INTERRUPTED = 13;           // 被中断(调用过程进程退出)
    RET_PB_PARSE_ERROR = 14;        // 反序列化失败
    RET_NO_MATCH_TASK = 15;         // 无匹配的任务; 在取消任务, 结束任务等的时候如果任务ID不匹配会返回这个状态
    RET_FOCUS_PAUSED = 16;          // 焦点暂停
    RET_NOT_IMPL = 17;              // 未实现
    RET_REQ_PB_PARSE_ERROR = 18;    // 请求数据PB解析失败
    RET_INVALID_PID = 19;           // 无效PID
    RET_UNSUPPORT_RESOURCE_PRIORITY = 20;   // 不支持的资源优先级
    RET_INVALID_TOKEN = 21;         // token 无效
    RET_INTERNAL_ALGO_ERROR = 22;   // 内部算法执行错误
    RET_TASK_CANCELED = 23;         // 任务被取消
    RET_TASK_EXEC_TIMEOUT = 24;     // 任务执行超时
    RET_TASK_NO_IMPL_RESULT = 25;   // 任务执行完毕后没有设置结果
    RET_ALGO_UNSUPPORT_SKILL = 26;  // 算法不支持技能
    RET_TASK_OVERRIDE = 27;         // 任务被覆盖
    RET_SKILL_RUNNING = 28;         // 技能重复，已经执行中
    RET_ON_DAMP = 29;               // 关节阻尼中
    RET_ON_STALLING = 30;           // 关节僵硬中
    RET_SERVICE_DISABLED = 31;      // 服务被失能
    RET_ON_FAULT = 32;              // 整机故障. 无法响应请求
    RET_ON_STAND_NOT_READY = 33;    // 未站立就绪
    RET_ALGO_DENIED = 34;           // 算法拒绝执行
    RET_BUSY_ON_OTA = 35;           // 在OTA升级中
    RET_BUSY_ON_SHUTDOWN = 36;      // 在准备关机中
    RET_FOCUS_RELEASED = 37;        // 焦点被释放, 执行任务过程中客户端直接释放焦点时，任务会被取消并返回这个结果码
    RET_ON_CALIB_MODE = 38;         // 标定模式下，此模式下不允许执行技能，只能触发执行器标定（motorCalib）
    RET_CANCELED_BY_OBSTACLE = 39;  // 导航/跟随等任务因为遇到障碍物，且持续（X）分钟未能绕过障碍物，自动停止导航/跟随任务
    RET_WORK_MODE_UNSUPPORT_OP = 40;    // 当前工作模式下不支持此操作或技能; 场景：在非标定模式下去请求执行器标定
    RET_CANCELED_EMERGENCY_PAUSE = 41;  // 紧急暂停触发的取消
    RET_CANCELED_EMERGENCY_STOP = 42;   // 紧急停止触发的取消
    RET_BUSY_ON_TELEOPMODE = 43;        // 在全身遥操模式下, 此模式下不允许执行导航/跟随等等导航算法; 仅允许切换运控模式
    RET_LOCATE_FAILED = 44;             // 定位失败，在触发导航时，如果定位失败，会直接返回这个状态码
    RET_MAP_ID_MATCH_FAILED = 45;       // 地图ID匹配失败，比如当前正在使用地图A，但是发起的导航，重定位等等使用地图B，就会返回这个状态码
    RET_LOWER_BATTERY_TERMINATED = 46;  // 低电量
    RET_DISTANCE_LIMIT_EXCEEDED = 47;   // 距离太长，自动停止
    RET_ONCHARGING = 48;                // 充电中
    RET_NOT_CALIBED = 49;               // 机器未标定，没有标定过机器时直接触发执行技能，会返回这个状态
    RET_OVERHEAT_LIMITED = 50;          // 过热受限（高温保护中）
    RET_NO_CHARGING_POS = 51;           // 无充电桩点
    RET_MOTOR_FAULTS = 52;              // 电机故障
}

// RobotService的api功能, 提供普通的查询、获取等功能
enum ApiType {
    QUERY_ALL_SKILLS = 0;           // (技能焦点)查询支持的技能以及相应的mask;
    CONFIGURE = 1;                  // 配置
    DECONFIGURE = 2;                // 取消配置
    GET_RUNNING_TASK_INFO = 3;      // 查询技能执行情况
    NAV_CALIBATION_INFO = 4;        // 获取导航模块的标定信息
    QUERY_EXPLORE_POINT = 5;        // 漫游点位获取
    MOTOR_CALIBRATION_INFO = 6;     // 电机标定信息
    HEARTBEAT = 7;                  // 心跳(需要携带token, RobotService.srv中的token需要为真正的token值)
    QUERY_MAP_STATIONS = 8;         // 查询点位名称
    QUERY_TRAJECTORYS = 9;          // 查询录制的轨迹列表Trajectory
    DELETE_TRAJECTORYS = 10;        // 删除轨迹
    RECHARGING_CHECK = 11;          // 回桩信息检查，响应数据为rechargingCheckResult
}

// api请求体
message ApiRequest {
    int32 api = 1;

    oneof para {
        srcp.skill.args.QueryAllSkills queryAllSkills = 2;
        srcp.skill.args.ConfigureOptions configureOptions = 3;
        srcp.skill.args.QueryMapStationsReq queryMapStationsReq = 4;  // 查询点位名称
        srcp.skill.args.DeleteTrajectorysReq deleteTrajectorysReq = 5;  // 删除轨迹
    }
}

// api响应体
message ApiResponse {
    int32 api = 1;

    oneof result {
        srcp.skill.args.QueryAllSkillResult queryAllSkillsResult = 2;
        srcp.skill.args.ConfigureResult configureResult = 3;
        srcp.skill.args.RunningTaskList runingTaskList = 4;
        srcp.skill.args.NavCalibrationInfo NavCalibrationInfo = 5;
        srcp.skill.args.ExplorePoint explorePoint = 6;
        srcp.skill.args.MotorCalibResult motorCalibResult = 7;
        srcp.skill.args.QueryMapStationsResp queryMapStationsResp = 8; // 查询点位名称（响应）
        srcp.skill.args.QueryTrajectorysResp queryTrajectorysResp = 9; // 查询轨迹列表的响应
        srcp.skill.args.DeleteTrajectorysResp deleteTrajectorysResp = 10; // 删除轨迹列表的响应
        srcp.skill.args.RechargingCheckResult rechargingCheckResult = 11; //
    }
}

