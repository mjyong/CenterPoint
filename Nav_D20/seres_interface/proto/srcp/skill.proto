        srcp.args.PickUp pickUp                         = 326;   // 拿取
        srcp.args.PlaceDown placeDown                   = 327;   // 放置
        srcp.args.Approach approach                     = 328;   // 靠近
        srcp.args.PushForward pushForward               = 329;   // 前推
        srcp.args.PullBack pullBack                     = 330;   // 后拉
        srcp.args.Carry carry                           = 331;   // 搬运
        srcp.args.StartWork startWork                   = 332;   // 开始工作
        srcp.args.EndWork endWork                       = 333;   // 结束工作
        srcp.args.MotionControl motionSkill             = 334;   // 运动控制，需要下发参数的运控技能
        srcp.args.WaistRise waistRise                   = 335;   // 腰部上升
        srcp.args.WaistLower waistLower                 = 336;   // 腰部下降


    }
}

message SkillCommand {
    string id            = 1;   // 任务UUID
    string skill         = 2;   // 技能
    int64 timestamp      = 1000;    // 数据包的时间戳, 方便用来测试调用链路的延迟

    oneof para {
        srcp.args.Move move    = 3;    // 移动的参数
        srcp.skill.args.JointsControl jointsControl = 4; // 运动关节控制
        srcp.args.StepStill stepStill               = 5; // 原地踏步
        srcp.skill.args.SwingBody swingBody         = 6; // 摆动身体
        srcp.args.PanTiltAngle angle                = 7; // 云台控制
        srcp.args.MotionControl motionSkill         = 8; // 运动控制，需要下发参数的运控技能
        srcp.args.Move slope                        = 9; // 上下坡(复杂地形平衡行走)
        srcp.args.Move joyWalk                      = 10; // 使用摇杆控制行走
        srcp.args.Move joyStairs                    = 11; // 使用摇杆控制上下楼梯
        srcp.args.Move joyUpHighPlatform            = 12; // 使用摇杆控制上高台
        srcp.args.Move joyCrawl                     = 13; // 使用摇杆控制匍匐
        srcp.args.Move joyStraightenLeg             = 14; // 使用摇杆控制腿打直
        srcp.skill.args.NavCalib navCalib           = 15; // 二次下发导航标定参数
        srcp.skill.args.BodyWobble bodyWobble       = 16; // 摇晃身体（音乐律动等）
        srcp.skill.args.SpeedAdjust speedAdjust     = 17; // 速度调节
    }
}

message SkillFeedback {
    string id            = 1;   // 任务UUID
    string skill         = 2;   // 技能

    oneof para {
        srcp.skill.args.MoveFeedback move    = 3;           // 移动的参数
        srcp.skill.args.NavCalibFeedback navCalib = 4;      // 导航标定数据
        srcp.skill.args.MotorCalibFeedback motorCalib = 5;  // 电机标定数据
        srcp.skill.args.NavigateFeedback navigate = 6;                              // 导航反馈数据, 停障，恢复等等（事件触发）
        srcp.skill.args.FollowObjectFeedback followObject = 7;                      // 跟随反馈数据, 停障，恢复等等（事件触发）
        srcp.skill.args.SpinningOnTheSpotFeedback spinningOnTheSpot = 8;            // 前进距离反馈数据, 停障，恢复等等（事件触发）
        srcp.skill.args.PTZCameraFeedback ptzCamera = 9;                            // 云台相机控制
        srcp.skill.args.HeadPoseControlFeedback headPoseControl        = 10;        // 头部角度控制的反馈
        srcp.skill.args.RecordMoveTrajectoryFeedback recordMoveTrajectory = 11;     // 录制轨迹
        srcp.skill.args.ReplayMoveTrajectoryFeedback replayMoveTrajectory = 12;     // 轨迹回放
        srcp.skill.args.EarsCalibFeedback earsCalib = 13;                           // 耳朵标定反馈
        srcp.skill.args.SafetyGuardFeedback safetyGuard = 14;                       // 安全守卫反馈MapOperateFeedback
        srcp.skill.args.MapOperateFeedback mapOperate = 15;                         // 地图操作反馈
    }
}

message SkillResult {
    string id            = 1;   // 任务UUID
    string skill         = 2;   // 技能
    int32 ret            = 3;   // 执行结果

    oneof para {
        srcp.skill.args.MoveResult move    = 4;    // 移动的参数
        srcp.skill.args.RecordTrajectoryResult recordMoveTrajectory = 5; // 轨迹录制的结果
        srcp.skill.args.SafetyGuardResult safetyGuard = 6;  // 安全守卫的结果
        srcp.skill.args.NavCalibResult navCalibResult = 7;   // 标定结果; 仅在标定执行成功时才有值
    }

    oneof ret_info {
        srcp.skill.args.FocusPausedInfo focusPaused = 2000;                 // 焦点暂停时的信息, RET_FOCUS_PAUSED时有效
        srcp.skill.args.TaskOverrideInfo taskOverride = 2001;               // 任务覆盖信息, RET_TASK_OVERRIDE时有效
        srcp.skill.args.MotorFaultInfo motorFaultInfo = 2002;               // 电机故障信息, RET_MOTOR_FAULTS时有效
    }
}