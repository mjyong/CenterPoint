// R11/R11-W
/*
    双手摊开讲解上	openExplainUp	   											openExplain dir=0
    双手摊开讲解下	openExplainLow	 										  openExplain	dir=1
    双手摊开讲解上（静态）	openExplainUpStatic			        openExplain	dir=2
    双手摊开讲解下（静态）	openExplainLowStatic 		        openExplain	dir=3
    左介绍/左引导	introduceLeft												    openExplain	dir=4
    右介绍/右引导	introduceRight	    										openExplain	dir=5
    左中讲解	explainLeftMed														 openExplain	dir=6
    右中讲解	explainRightMed														 openExplain	dir=7
    左中右动态讲解（右手）	explainLeftMidRight				     openExplain	dir=8
    上中下动态讲解（右手）	explainUpMidLowRight		       openExplain	dir=9
    五分钟长时间讲解-左手起步	explainGestureLeft		       openExplain	dir=10
    五分钟长时间讲解-右手起步	explainGestureRight		       openExplain	dir=11
*/
message OpenExplain {
  enum Direcation {
    HIGH = 0; //开放上讲解
    LOW = 1;  //开放下讲解
  }
  Direcation dir = 1;
}

/*
      长时间介绍-50秒（双手-右手起步）	long_present   mode=3
    长时间介绍-60秒	long_present60        mode=2   
    长时间介绍-30秒（双手-右手起步）	long_present30  mode=1
*/
message LongPresent {
  enum Mode {
    DURATION_TWENTY = 0; //20s
    DURATION_THIRTY = 1; //30s long_present30
    DURATION_60S = 2;    // 长时间介绍-60秒	long_present60
    DURATION_50S = 3;    // 长时间介绍-50秒（双手-右手起步）long_present
  }
  Mode mode = 1;
}

