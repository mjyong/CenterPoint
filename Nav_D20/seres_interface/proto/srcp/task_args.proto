syntax = "proto3";

package srcp.args;
import "nav_operation.proto";

/*
* 一个指令参数对应一个技能
* 技能名称规则为技能参数名称首字母小写
* 例如：
* SitDown对应技能sitDown技能名称
* Stand对应技能stand技能名称
* 其余类推      
*/

//运控指令参数，坐下，无具体参数，仅占位，表示支持坐下功能
message SitDown {
}

//运控指令参数，站立，含各种姿态下的起立，
//如：蹲姿起立、躺姿起立、坐姿起立等
message Stand {
}

enum HandRes {
    HAND_RES_DEFAULT = 0;   // 默认
    HAND_RES_LEFT    = 1;   // 左手
    HAND_RES_RIGHT   = 2;   // 右手
    HAND_RES_BOTH    = 3;   // 双手
}

// 导航/跟随/前进距离 状态反馈
enum NavState {
    NAV_STA_TASK_EXEC_SUCCESS    = 0;         // 任务执行成功
    NAV_STA_TASK_EXEC_FAILED     = 1;         // 任务执行失败
    NAV_STA_TASK_EXEC_DOING      = 2;         // 任务执行中

    NAV_STA_MAP_DOING            = 1001;       // 建图中
    NAV_STA_MAP_LOAD_FAILED      = 1002;       // 地图加载失败

    NAV_STA_NAVGATING            = 2001;       // 导航中
    NAV_STA_EXPLORING            = 2002;       // 探索中 
    NAV_STA_PLAN_DOING           = 2011;       // 路径规划中
    NAV_STA_PLAN_DONE            = 2012;       // 路径规划完成
    NAV_STA_PLAN_PATH_FAILED     = 2013;       // 路径规划失败
    NAV_STA_MAP_UNMATCHED        = 2014;       // 导航下发的map_uuid不匹配

    NAV_STA_OBSTACLE_WAY         = 3001;      // 路径遇障碍
    NAV_STA_OBSTACLE_AVOIDING    = 3002;      // 避障中
    NAV_STA_OBSTACLE_FAILED      = 3003;      // 绕障失败
    NAV_STA_OBSTACLE_SUCCESS     = 3004;      // 绕障成功

    NAV_STA_RELOCATION_FAILED    = 4001;      // 重定位失败

    NAV_STA_FOLLOW_DOING         = 5001;      // 跟随中
    NAV_STA_FOLLOW_OBJ_LOST      = 5002;      // 跟随目标丢失
    NAV_STA_FOLLOW_OBJ_MISMATCH  = 5003;      // 跟随目标不匹配

    NAV_STA_STAKE_NOT_FOUND      = 6001;      // 充电桩未找到
    NAV_STA_STAKE_TO_FAILE       = 6002;      // 回桩失败
}

// 重复模式
enum RepeatMode {
    ONCE = 0;            // 只摇一次
    PERIODIC = 1;        // 周期性, 需要调用者手动停止
}

//运控指令参数，调整移动速度
message MoveLevel {
    enum Level {
        LOW_SPEED = 0; //低速
        MIDDLE_SPEED = 1; //中速
        HIGH_SPEED = 2; //高速
    }
    Level level = 1; //运控速度等级控制
}

//运控指令参数，行走
message Move {
    float vx = 1; //vx: 前后速度(正为前)
    float vy = 2; //vy: 左右速度(正为左)
    float vyaw = 3; //vyaw: 左右旋转速度(正为逆时针旋转)
    float duration = 4; //持续移动时间，单位秒(目前仅R11涉及)
}

//运控指令参数，原地踏步;
// 速度参数为0时表示原地踏步，不为0时表示踏步行走
// duration大于0时表示执行duration秒后自动停止;为0时表示一直执行， 不主动停止
message StepStill {
    float vx = 1; //vx: 前后速度(正为前)
    float vy = 2; //vy: 左右速度(正为左)
    float vyaw = 3; //vyaw: 左右旋转速度(正为逆时针旋转)
    float duration = 4; //持续移动时间，单位秒
}

//运控指令参数，停止移动，无具体参数，仅占位，表示支持该功能
