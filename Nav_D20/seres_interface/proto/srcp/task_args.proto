//语音指令参数，播放文本以及表情
message PlayTTS {
    string text = 1; //待播放的文本
    string emo = 2; //播放时表情
    int32 num_cycles = 3; //文本播放次数
    int32 interval = 4; //任意两次播放中间等待时间
    string intent =5;
    bool interruptible = 6;
    int32 mode = 7;
}

//音视频指令参数，监控机器人本体音视频
message MonitorAVStream {
    bool av_enabled          = 1; //true本体开始向云端推音视频流，false本体停止向云端推音视频流
    repeated uint32 cameraId = 2; //表示摄像头id 摄像头编号，0为左路摄像头，1为右路摄像头,
                                  //2为前路摄像头，3为后路摄像头，4为拼接环视视频，5为可见光视频，6为红外视频 (cameraId目前仅D10涉及)
}

//音视频指令参数，本体向云端推音视频流，云端向本体推音视频流
message Call {
    int32 audio_enabled = 1; //1-本体开始向云端推音频流，2-本体停止向云端推音频流
    bool video_enabled = 2; //本体和云端双向推视频流
    int32 audio_enabled_down = 3; //1-云端向本体推音频流，2-云端停止向本体推音频流
}

//导航指令参数，建图
message Mapping
{
    enum Mode {
        START   = 0; //开始建图
        STOP    = 1; //结束建图
        PAUSE   = 2; //暂停建图
        RECOVER = 3; //恢复建图
        CANCEL = 4; //取消建图
    }

    enum ExploreMode {
      EXPLORE_MODE_MAPPING = 0; //建图模式
      EXPLORE_MODE_WANDER = 1;  //漫游
    }
    Mode mode       = 1; //建图方式
    string map_name = 2; //地图名称，创建地图时必须
    string map_uuid = 3; // 建图的uuid,新建时为空

    //探索时才需要以下数据，普通建图不需要
    ExploreMode explore_mode = 4; 
    string object_name = 5; //在EXPLORE_MODE_WANDER中寻物目标，非空有效,参考https://sai-seres.feishu.cn/wiki/ONdUw04Lki0eVykh351cCdJVnzh
    int32 distance = 6; //探索半径，单位cm，非0有效
};

message EulerAngles {
    float roll = 1;
    float pitch = 2;
    float yaw = 3;
}

message Quaternion {
    float x = 1;
    float y = 2;
    float z = 3;
    float w = 4;
}

// 坐标系头部信息，类似 ROS2 std_msgs/Header
message FrameHeader {
    int64 sec = 1;              // 秒
    int32 nanosec = 2;            // 纳秒
    string frame_id = 3;         // 
}

message PointOrientation {
    float x = 1;
    float y = 2;
    float z = 3;
    FrameHeader header = 4;   // header为相对于第一个点时间，0无效
    
    oneof orientation {
        EulerAngles euler = 5;     // 欧拉角表示
        Quaternion quat = 6;       // 四元数表示
    }
}

enum AvoidObstacles {
  OBSTACLE_AVOID = 0;  // 绕障 - 主动避让障碍物
  OBSTACLE_STOP  = 1;  // 停障 - 遇到障碍物停止
}

//导航指令参数，导航
message Navigate
{
    enum Mode {
        POINT   = 0;         //点导航
        PATH    = 1;         //路径导航
        TRACK   = 2;         // 跟踪导航（参数传入trackId）
        TARGET  = 3;         // 目标物导航(参数传入trackId， 导航到目标物体前， 导航结束)
        UVD     = 4;         // 视距导航
    }

    enum Control {
        START   = 0;         //开始导航
        STOP    = 1;         //结束导航
    }

    message Point {
        float x = 1;         // 坐标X
        float y = 2;         // 坐标Y
        float z = 3;         // 坐标Z

        // 这三个参数可以通过tf2::Quaternion转换为geometry_msgs/msg/Quaternion
        float roll  = 4;     // 旋转角度 - 横滚
        float pitch = 5;     // 旋转角度 - 俯仰
        float yaw   = 6;     // 旋转角度 - 航向

    }

    Control ctrl        = 1;    //导航控制, robot_service 这个字段废弃不再使用;
    string map_name     = 2;    //地图名称
    Mode nav_mode       = 3;    //导航模式
    repeated Point point = 4;   //目标点或者路径
    string track_id     = 5;    // 追踪ID, Mode为TRACK时必传
    string map_uuid     = 6;

    double max_speed    = 7; //导航的最大速度，单位m/s, 值为0时robot_service默认设置为1m/s
    AvoidObstacles avoid_obstacles = 8; // 避障策略
    repeated PointOrientation point_orientation = 9; // 点位坐标, 优先识别point_orientation，如果数据是空，再去识别point(兼容旧接口)
    float speed = 10; //指定导航速度，0：无效；有效时，忽略PoseStamped中时间限定
    float obstacles_fail_timeout = 11;      // 停障失败时，自动取消任务的超时时间：单位是秒数, 不设置时默认是15分钟
}

//灵巧抓取指令，抓取目标
