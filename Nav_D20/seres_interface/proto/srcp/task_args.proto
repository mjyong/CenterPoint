  int32 cameraId = 3;      // cameraId: 相机id 摄像头编号，5为可见光视频，6为红外视频
}

// 步态切换命令
message GaitCtrl
{
    // 步态类型枚举
    enum GaitType {
        GAIT_UNKNOWN        = 0;    // 默认
        GAIT_WALK           = 1;    // 行走
        GAIT_RUNNING        = 2;    // 跑步
        GAIT_STAIR_ASCEND   = 3;    // 上楼梯
        GAIT_STAIR_DESCEND  = 4;    // 下楼梯
    }

    GaitType gaitType       = 1;     // 步态类型
}

//LED灯控制
message LightCtrl
{
  enum BrightnessLevel {
    LOW     = 0; // 低
    MEDIUM  = 1; // 中
    HIGH    = 2; // 高
  }

  enum LightCtrlState {
    LIGHT_OFF     = 0; // 关闭
    LIGHT_ON      = 1; // 开启
  }

  enum LightType {
    LIGHT_MAIN      = 0; // 主照明灯（D30，R11等）
    LIGHT_FRONT     = 1; // 前补光灯（D20）
    LIGHT_REAR      = 2; // 后补光灯（D20）
  }

  enum LightMode {
    LIGHT_MODE_MANUAL = 0; // 手动模式
    LIGHT_MODE_AUTO   = 1; // 自动模式
  }

  BrightnessLevel level = 1; // 灯亮度等级
  LightCtrlState state = 2; // 是否开启
  LightType light_type = 3; // 灯类型，默认主照明灯（兼容旧版本）
  LightMode light_mode = 4; // 灯模式，默认手动（兼容旧版本）
}


