    LEFT_RIGHT = 1;       // （机器人向左/右转动腰部xxx度）
    UP_DOWN    = 2;       // （机器人向上/下转动腰部xxx度）
  }

  WaistRotationMode mode = 1;
  float degree            = 2;  // 转动角度, 正值为左/上，负值为右/下，没有具体角度可以传-1或1 ，也可以不传, 不传时每个算法会按一个默认方向和角度进行转动
}

