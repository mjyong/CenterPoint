// # 运控姿态控制
message MotionControl {
    enum MotionSkill{
        MOTION_POSE_UNKNOWN = 0;
        MOTION_BODY_POSE            = 106;   // 躯干位姿控制：torso_yaw(关节3)和hip_pitch(关节2)步进运动，para=[torso_yaw, hip_pitch, duration?]
        MOTION_EULER_BODY           = 107;   // 身体Euler控制（按速度到指定角度，执行loop次相对于0点的来回摆动），7个参数：roll,pitch,yaw，vr,vp,vy， loop；单位：rpy：rad， vrpy：rad/s
        MOTION_JOINTS_TARGET_POSE   = 108;   // 关节目标姿态位置控制；para[]关节目标位置参数，详见具体设备关节id定义
        MOTION_HEAD_POSE            = 3000;  // 头部姿态控制(按频率实时控制)，控制频率20Hz；3个参数：vroll,vpitch,vyaw；单位：vrpy:rad/s
        MOTION_EULER_HEAD           = 3001;  // 头部Euler控制（按速度到指定角度，执行loop次相对于0点的来回摆动），7个参数：roll,pitch,yaw，vr,vp,vy， loop；单位：rpy：rad， vrpy：rad/s
    }
    float duration = 1;
    MotionSkill motion_skill = 2;
    repeated float para = 3;
}

