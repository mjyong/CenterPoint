COMLOG_PROCNAME : lidar_seg 
COMLOG_LEVEL : 16 
COMLOG_LOGLENGTH : 2000
COMLOG_SELFDEFINE : SELFDEFINE 

COMLOG_DEVICE_NUM : 1
COMLOG_DEVICE0 : NOTICE
#COMLOG_DEVICE1 : WF

NOTICE_OPEN : 1
NOTICE_TYPE : FILE
NOTICE_PATH : ./log/perception/
NOTICE_NAME : lidar_seg.log
NOTICE_SYSLEVEL : 0 
NOTICE_SELFLEVEL : FATAL,WARNING,NOTICE,TRACE,DEBUG
NOTICE_SPLITE_TYPE : DATECUT 
# 时间切割单位:分钟
NOTICE_DATA_CUTTIME : 60 
NOTICE_DATA_CRONOCUT: 1
NOTICE_RESERVED1 : %Y%m%d%H 
NOTICE_LAYOUT : | %L | %A | %P | %T | %R

