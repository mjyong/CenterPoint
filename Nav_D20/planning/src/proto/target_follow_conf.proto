syntax = "proto2";

package planning.config;
import "teb_planner_conf.proto";

message TargetFollowConf {
  optional double headway_time = 10 [default = 2.0];
  optional double max_follow_dist = 11 [default = 3.0];
  optional double min_follow_dist = 12 [default = 0.5];
  optional int32 speed_filter_window = 13 [default = 10];
  optional double spacing_gain = 14 [default = 0.5];
  optional double min_goal_ahead = 15 [default = 0.3];
  optional double arrive_dist_thresh = 7 [default = 0.25];
  optional double arrive_theta_thresh = 8 [default = 0.5];

  message TargetPathExtractConf {
    optional int32 filter_window = 1 [default = 30];
    optional double jump_reset_thresh = 2 [default = 0.5];
    optional int32 max_consecutive_jumps = 3 [default = 5];
    optional double accept_thresh = 4 [default = 0.25];
    optional double max_path_length = 5 [default = 10.0];
    optional double smooth_resample_interval = 7 [default = 0.25];
  }
  optional TargetPathExtractConf target_path_extract_conf = 2;
  optional TebPlannerConf teb_planner_conf = 9;
  optional double target_lost_timeout = 4 [default = 0.8];
}
