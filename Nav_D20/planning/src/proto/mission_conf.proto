syntax = "proto2";

package planning.config;
import "grid_path_planner_conf.proto";
import "mppi_planner_conf.proto";
import "target_follow_conf.proto";
import "teb_planner_conf.proto";

message MissionConf {
  enum Type {
    Idle       = 0;
    Tracking   = 1;
    Following  = 2;
    Recharging = 3;
    Skill      = 4;
  }
  repeated Type   types           = 1;
  repeated Conf   confs           = 2;
  required double reset_idle_time = 3 [default = 2.0];
  message Conf {
    optional Type type = 1;
    oneof config {
      TrackingConf   tracking_conf   = 2;
      FollowingConf  following_conf  = 3;
      RechargingConf recharging_conf = 4;
      SkillConf      skill_conf      = 5;
    }
  }
  message TrackingConf {
    enum PlannerType {
      TEB  = 0;
      MPPI = 1;
    }
    optional TebPlannerConf      teb_planner_conf               = 3;
    optional double              off_distance_threshold         = 4 [ default = 0.05 ];
    optional double              off_yaw_threshold              = 5 [ default = 0.05 ];
    optional double              off_velocity_threshold         = 6 [ default = 0.1 ];
    optional double              off_angular_velocity_threshold = 7 [ default = 0.05 ];
    optional double              off_duration_threshold         = 8 [ default = 1.0 ];
    optional PlannerType         planner_type                   = 9 [ default = TEB ];
    optional MppiPlannerConf     mppi_planner_conf              = 10;

    optional bool   nav_blocked_enable           = 11 [ default = false ];
    optional double nav_blocked_progress_epsilon = 12 [ default = 0.02 ];
    optional double nav_blocked_window           = 13 [ default = 1.5 ];
    optional double nav_blocked_enter_duration   = 14 [ default = 1.5 ];
    optional double local_reference_path_length   = 15 [ default = 5.0 ];
    optional CrosswalkYieldConf crosswalk_yield_conf  = 16;
  }
  // Crossing at the map's crosswalks (src/runnable/mission/tracking/crosswalk_yield.h; ours, T51 review)
  message CrosswalkYieldConf {
    optional bool   enable              = 1  [ default = false ];
    optional double stop_margin         = 2  [ default = 0.3 ];    // [m] stop half a body + this before the entry
    optional double slow_distance       = 3  [ default = 3.0 ];    // [m] slow down over this before the stop point
    optional double min_speed_scale     = 4  [ default = 0.2 ];
    optional double hold_distance       = 5  [ default = 0.1 ];    // [m] this close to the stop point: stop, turn
    optional double align_tolerance_deg = 6  [ default = 10.0 ];
    optional double align_gain          = 7  [ default = 1.0 ];
    optional double max_align_omega     = 8  [ default = 0.5 ];    // [rad/s]
    optional double check_beyond_exit   = 9  [ default = 1.0 ];    // [m] the gate checks to the exit plus this
    optional double lookahead           = 10 [ default = 40.0 ];   // [m] crosswalks looked for this far ahead
    optional double moving_speed        = 11 [ default = 0.1 ];    // [m/s]
    optional double max_pose_gap        = 12 [ default = 0.3 ];    // [s] perception beyond the odometry: stale
    // perception's frame (on the ground under the lidar, x right, y forward) in base_link; D20 A2 (T46)
    optional double det_to_base_x       = 13 [ default = 0.319 ];
    optional double det_to_base_y       = 14 [ default = 0.043 ];
    optional double det_to_base_yaw_deg = 15 [ default = -90.0 ];
    optional string yield_rule          = 16 [ default = "wait" ]; // wait (decided 2026-11-12) / gap / stop
    optional double stale_after         = 17 [ default = 0.3 ];    // [s] perception older than this: wait
    // on a crosswalk without the gate's go (a localization jump at the curb): up to this far past the entry, hold
    // and ask the gate; deeper (started on the road): cross (T52 review)
    optional double max_unreleased_depth = 18 [ default = 1.5 ];  // [m]
  }
  message FollowingConf {
    enum Type {
      PathFollow   = 0;
      TargetFollow = 1;
    }
    optional Type             follow_type        = 1;
    optional string           default_path_file  = 2;
    optional TargetFollowConf target_follow_conf = 3;
  }

  message RechargingConf {
    required double vx_min           = 1 [ default = -0.3 ];
    required double vx_max           = 2 [ default = 0.3 ];
    required double vy_max           = 3 [ default = 0.3 ];
    required double yaw_rate_max     = 4 [ default = 0.3 ];
    required double vx_gain          = 5 [ default = 1.0 ];
    required double vy_gain          = 6 [ default = 3.0 ];
    required double yaw_rate_gain    = 7 [ default = 1.0 ];
    optional double vx_ki            = 20 [ default = 0.0 ];
    optional double vx_kd            = 21 [ default = 0.0 ];
    optional double vy_ki            = 22 [ default = 0.0 ];
    optional double vy_kd            = 23 [ default = 0.0 ];
    optional double yaw_rate_ki      = 24 [ default = 0.0 ];
    optional double yaw_rate_kd      = 25 [ default = 0.0 ];
    optional double detect_spin_rate = 8 [ default = 0.5 ];
    optional double ready_distance   = 9 [ default = 2.0 ];

    optional double period                     = 11 [ default = 0.05 ];
    optional double time_out_threshold         = 12 [ default = 60.0 ];
    optional double standby_pos_tolerance      = 13 [ default = 0.1 ];
    optional double standby_euler_tolerance    = 14 [ default = 0.1 ];
    optional double standby_stable_time        = 15 [ default = 2.0 ];
    optional double standstill_pos_x_tolerance = 16 [ default = 0.05 ];
    optional double standstill_pos_y_tolerance = 17 [ default = 0.02 ];
    optional double standstill_euler_tolerance = 18 [ default = 0.1 ];
    optional double standstill_stable_time     = 19 [ default = 2.0 ];
    optional double charging_station_offset_x  = 29 [ default = 0.0 ];
    optional double charging_station_offset_y  = 33 [ default = 0.0 ];
    optional double charging_station_offset_yaw = 35 [ default = 0.0 ];  
    optional double vx_deadband                = 30 [ default = 0.1 ];
    optional double vy_deadband                = 31 [ default = 0.1 ];
    optional double yaw_rate_deadband          = 32 [ default = 0.1 ];
    optional double sitting_height             = 34 [ default = 0.0 ];  // 蹲下前身体目标高度（z方向，相对于当前位置）
  }
  message SkillConf {
    optional double max_vx = 1 [ default = 0.3 ];
    optional double max_vy = 2 [ default = 0.2 ];
    optional double max_omega = 3 [ default = 0.4 ];
    optional double max_accel = 4 [ default = 0.8 ];
    optional double max_angular_accel = 5 [ default = 1.0 ];
    optional double position_tolerance = 6 [ default = 0.05 ];
    optional double yaw_tolerance = 7 [ default = 0.05 ];
  }
}
